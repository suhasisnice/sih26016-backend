# Alembic configuration.
#
# sqlalchemy.url is deliberately absent. The database URL carries a
# password, this file is committed, and app/config.py already resolves the
# URL from the environment with the normalisation every managed host needs
# (postgres:// rewriting, pgbouncer= stripping). alembic/env.py reads it
# from there, so there is exactly one place a connection string is decided.

[alembic]
script_location = alembic
prepend_sys_path = .

# Revisions are numbered rather than hash-named: the order a reviewer reads
# them in is the order they apply in, which a random hex slug hides.
file_template = %%(rev)s_%%(slug)s

# Timestamps in migration files are UTC. A team spread across timezones
# otherwise writes revisions that appear to travel backwards in time.
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
